# Phase 2 MAIN AGENT: standard PPO controlling the whole site ("site" design, our
# original plan) with our reward and the LAXITY observation, no early departures yet
# (p_early = 0, "PPO-Trusting" setting). Best design in the Phase 2 comparison at a
# 100 % target (test −33.4 vs AFAP −46.0; ADR-0005 Outcome, EXPERIMENT_LOG).
# Every driver now wants 80 % (ADR-0006); compare with AFAP-to-target. The 100 %
# case is the sensitivity check: --set env.charging_target=1.0
# λ_dep = 500: development default from the first calibration at the 80 % target
# (Phase 2 plan); Phase 4 runs the grid {200, 500, 1000} with >= 5 seeds.

name: p2-site-laxity-ppo
agent: PPO-Trusting
agent_design: site # site | shared_charger | central_credit

env:
  config: configs/env/v2g_profitmax_20port.yaml
  state_function: V2G_profit_max_laxity # + per car: steps still needed and spare time (envs/state.py)
  reward_function: squared_shortfall # profit − λ_over·overload² − λ_dep·shortfall² (rewards/shortfall_reward.py)
  reward_kwargs:
    lambda_dep: 500.0 # weight of Σ (target SoC − SoC at departure)², SoC 0..1; calibrated (Phase 2 plan): grid {200, 500, 1000}
    lambda_over: 0.1 # weight of Σ (kW above transformer rating)²; 10 kW over ≈ one car 45 % short
  charging_target: 0.8 # battery level every driver wants at departure (ADR-0006)

scenarios: configs/eval/scenarios.yaml

training:
  total_timesteps: 3000000 # ~26,800 simulated days of 112 steps
  n_envs: 16 # simulated days played in parallel (one CPU process each)
  device: cpu # chosen by the CPU vs GPU timing test (scripts/timing_test.py)
  torch_threads: 1 # CPU threads for the PPO update: 1 was fastest in the timing test (ADR-0003)
  # VecNormalize: rescale observations (and rewards) to ~mean 0, std 1 so that
  # prices (~0.1 EUR) and step numbers (0..112) are on similar scales. Ref: [R13]
  normalize_obs: true
  normalize_reward: true
  eval_every_steps: 50000 # validation run + best-model checkpoint
  checkpoint_every_steps: 100000 # resumable checkpoints (CODING_RULES §7)

# PPO settings (Stable-Baselines3). Mostly SB3 defaults. Ref: [R8], [R13]
ppo:
  learning_rate: 0.0003
  n_steps: 448 # steps per env before each update = 4 days; buffer = 448 x 16 = 7,168
  batch_size: 512
  n_epochs: 10
  gamma: 0.99 # how much future rewards count (0.99 ~ looks ~100 steps ahead)
  gae_lambda: 0.95 # GAE smoothing of advantages. Ref: [R12]
  clip_range: 0.2 # PPO clipping: limits how much the policy changes per update. Ref: [R8]
  ent_coef: 0.0 # bonus for exploring (randomness); 0 = SB3 default
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256] # two hidden layers of 256 (best size in the Phase 2 diagnostics)
    # Starting randomness of actions: std = exp(log_std_init); 0 -> std 1 (SB3 default),
    # -1 -> std 0.37 (less random at the start, so less accidental draining).
    log_std_init: 0.0

logging:
  wandb: online # online | offline | disabled (WANDB_MODE env var overrides)
  project: smartev2g # WANDB_PROJECT env var overrides
