# CI: runs lint + tests on every pull request and on pushes to main.
# A PR can only be merged when this is green (CODING_RULES.md §10).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled   # tests must never need wandb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          # Make a fresh virtual env and activate it: Ubuntu blocks installing into system Python.
          activate-environment: true
      - name: Install CPU-only PyTorch (smaller/faster in CI)
        run: uv pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt -r requirements-dev.txt
          uv pip install -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
